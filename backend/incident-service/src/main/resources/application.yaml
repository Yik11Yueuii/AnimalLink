spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:}
    password: ${RABBITMQ_PASSWORD:}
    publisher-confirm-type: correlated
  application:
    name: incident-service
  profiles:
    default: local
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        file-extension: yaml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/animallink_incident?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC
    username: ${INCIDENT_DB_USER:animallink_incident}
    password: ${INCIDENT_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8083}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      show-components: always
animallink:
  authentication:
    incident-admin-assertion:
      expected-issuer: ${AUTH_INCIDENT_ASSERTION_ISSUER:api-gateway}
      expected-subject: ${AUTH_INCIDENT_ASSERTION_SUBJECT:api-gateway}
      expected-audience: ${AUTH_INCIDENT_ASSERTION_AUDIENCE:incident-service}
      maximum-lifetime: ${AUTH_INCIDENT_ASSERTION_MAXIMUM_LIFETIME:PT30S}
      clock-skew: ${AUTH_INCIDENT_ASSERTION_CLOCK_SKEW:PT5S}
      replay-capacity: ${AUTH_INCIDENT_ASSERTION_REPLAY_CAPACITY:10000}
      keys: ${AUTH_INCIDENT_ASSERTION_KEYS:}
  messaging:
    enabled: ${ANIMALLINK_MESSAGING_ENABLED:true}
  identity:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
  animal:
    base-url: ${ANIMAL_SERVICE_URL:http://localhost:8082}
  intelligence:
    base-url: ${INTELLIGENCE_SERVICE_URL:http://localhost:8085}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET_INCIDENT:animallink-incident}
logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
