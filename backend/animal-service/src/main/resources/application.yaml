spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:}
    password: ${RABBITMQ_PASSWORD:}
  application:
    name: animal-service
  profiles:
    default: local
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        file-extension: yaml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/animallink_animal?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC
    username: ${ANIMAL_DB_USER:animallink_animal}
    password: ${ANIMAL_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8082}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      show-components: always
animallink:
  messaging:
    enabled: ${ANIMALLINK_MESSAGING_ENABLED:true}
  identity:
    base-url: ${IDENTITY_SERVICE_BASE_URL:http://localhost:8081}
    connect-timeout-ms: ${IDENTITY_SERVICE_CONNECT_TIMEOUT_MS:1500}
    read-timeout-ms: ${IDENTITY_SERVICE_READ_TIMEOUT_MS:2500}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET_ANIMAL:animallink-animal}
    intelligence-bucket: ${MINIO_BUCKET_INTELLIGENCE:animallink-intelligence}
logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}] [userId=%X{userId:-}]"
---
spring:
  config:
    activate:
      on-profile: "!test"
    import: optional:nacos:${spring.application.name}.yaml
