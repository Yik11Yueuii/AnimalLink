spring:
  application:
    name: adoption-service
  profiles:
    default: local
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        file-extension: yaml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/animallink_adoption?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC
    username: ${ADOPTION_DB_USER:animallink_adoption}
    password: ${ADOPTION_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8084}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      show-components: always
animallink:
  identity:
    base-url: ${IDENTITY_SERVICE_BASE_URL:http://localhost:8081}
  animal:
    base-url: ${ANIMAL_SERVICE_BASE_URL:http://localhost:8082}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET_ADOPTION:animallink-adoption}
logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
