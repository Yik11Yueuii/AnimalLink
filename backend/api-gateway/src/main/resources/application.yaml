spring:
  application:
    name: api-gateway
  profiles:
    default: secure
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        file-extension: yaml
    gateway:
      routes:
        - id: identity-service
          uri: lb://identity-service
          predicates: [Path=/identity/**]
          filters: [StripPrefix=1]
        - id: animal-service
          uri: lb://animal-service
          predicates: [Path=/animal/**]
          filters: [StripPrefix=1]
        - id: incident-service
          uri: lb://incident-service
          predicates: [Path=/incident/**]
          filters: [StripPrefix=1]
        - id: adoption-service
          uri: lb://adoption-service
          predicates: [Path=/adoption/**]
          filters: [StripPrefix=1]
        - id: intelligence-service
          uri: lb://intelligence-service
          predicates: [Path=/intelligence/**]
          filters: [StripPrefix=1]
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
animallink:
  authentication:
    service-assertion:
      issuer: ${AUTH_SERVICE_ASSERTION_ISSUER:api-gateway}
      subject: ${AUTH_SERVICE_ASSERTION_SUBJECT:api-gateway}
      audience: ${AUTH_SERVICE_ASSERTION_AUDIENCE:identity-service}
      lifetime: ${AUTH_SERVICE_ASSERTION_LIFETIME:PT15S}
      current-key-id: ${AUTH_SERVICE_ASSERTION_CURRENT_KEY_ID:}
      keys: ${AUTH_SERVICE_ASSERTION_KEYS:}
    identity-session:
      base-url: ${IDENTITY_INTERNAL_BASE_URL:http://identity-service}
      connect-timeout: ${IDENTITY_SESSION_CONNECT_TIMEOUT:PT2S}
      response-timeout: ${IDENTITY_SESSION_RESPONSE_TIMEOUT:PT3S}
      cookie-name: ${ADMIN_SESSION_COOKIE_NAME:ANIMALLINK_ADMIN_SESSION}
    trusted-source:
      trusted-proxies: ${TRUSTED_ENTRY_PROXIES:}
