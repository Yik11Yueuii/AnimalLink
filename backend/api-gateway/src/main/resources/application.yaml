spring:
  application:
    name: api-gateway
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration
  profiles:
    default: secure
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        file-extension: yaml
    gateway:
      routes:
        - id: identity-service
          uri: lb://identity-service
          predicates: [Path=/identity/**]
          filters: [StripPrefix=1]
        - id: animal-service
          uri: lb://animal-service
          predicates: [Path=/animal/**]
          filters: [StripPrefix=1]
        - id: incident-service
          uri: lb://incident-service
          predicates: [Path=/incident/**]
          filters: [StripPrefix=1]
        - id: adoption-service
          uri: lb://adoption-service
          predicates: [Path=/adoption/**]
          filters: [StripPrefix=1]
        - id: intelligence-service
          uri: lb://intelligence-service
          predicates: [Path=/intelligence/**]
          filters: [StripPrefix=1]
server:
  port: ${SERVER_PORT:8080}
  reactive:
    session:
      timeout: ${AUTH_CSRF_SESSION_TIMEOUT:PT30M}
      cookie:
        name: __Host-ANIMALLINK-CSRF-SESSION
        secure: true
        http-only: true
        same-site: strict
        path: /
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
animallink:
  authentication:
    service-assertion:
      issuer: ${AUTH_SERVICE_ASSERTION_ISSUER:api-gateway}
      subject: ${AUTH_SERVICE_ASSERTION_SUBJECT:api-gateway}
      audience: ${AUTH_SERVICE_ASSERTION_AUDIENCE:identity-service}
      lifetime: ${AUTH_SERVICE_ASSERTION_LIFETIME:PT15S}
      current-key-id: ${AUTH_SERVICE_ASSERTION_CURRENT_KEY_ID:}
      keys: ${AUTH_SERVICE_ASSERTION_KEYS:}
    animal-admin-assertion:
      issuer: ${AUTH_ANIMAL_ASSERTION_ISSUER:api-gateway}
      subject: ${AUTH_ANIMAL_ASSERTION_SUBJECT:api-gateway}
      audience: ${AUTH_ANIMAL_ASSERTION_AUDIENCE:animal-service}
      lifetime: ${AUTH_ANIMAL_ASSERTION_LIFETIME:PT15S}
      current-key-id: ${AUTH_ANIMAL_ASSERTION_CURRENT_KEY_ID:}
      keys: ${AUTH_ANIMAL_ASSERTION_KEYS:}
    incident-admin-assertion:
      issuer: ${AUTH_INCIDENT_ASSERTION_ISSUER:api-gateway}
      subject: ${AUTH_INCIDENT_ASSERTION_SUBJECT:api-gateway}
      audience: ${AUTH_INCIDENT_ASSERTION_AUDIENCE:incident-service}
      lifetime: ${AUTH_INCIDENT_ASSERTION_LIFETIME:PT15S}
      current-key-id: ${AUTH_INCIDENT_ASSERTION_CURRENT_KEY_ID:}
      keys: ${AUTH_INCIDENT_ASSERTION_KEYS:}
    adoption-admin-assertion:
      issuer: ${AUTH_ADOPTION_ASSERTION_ISSUER:api-gateway}
      subject: ${AUTH_ADOPTION_ASSERTION_SUBJECT:api-gateway}
      audience: ${AUTH_ADOPTION_ASSERTION_AUDIENCE:adoption-service}
      lifetime: ${AUTH_ADOPTION_ASSERTION_LIFETIME:PT15S}
      current-key-id: ${AUTH_ADOPTION_ASSERTION_CURRENT_KEY_ID:}
      keys: ${AUTH_ADOPTION_ASSERTION_KEYS:}
    identity-session:
      base-url: ${IDENTITY_INTERNAL_BASE_URL:http://identity-service}
      connect-timeout: ${IDENTITY_SESSION_CONNECT_TIMEOUT:PT2S}
      response-timeout: ${IDENTITY_SESSION_RESPONSE_TIMEOUT:PT3S}
      cookie-name: ${ADMIN_SESSION_COOKIE_NAME:ANIMALLINK_ADMIN_SESSION}
    trusted-source:
      trusted-proxies: ${TRUSTED_ENTRY_PROXIES:}
    browser:
      allowed-origins: ${AUTH_ADMIN_ALLOWED_ORIGINS:}
      maximum-login-body-bytes: ${AUTH_ADMIN_MAXIMUM_LOGIN_BODY_BYTES:4096}
