spring:
  application:
    name: intelligence-service
  profiles:
    default: local
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        file-extension: yaml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/animallink_intelligence?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC
    username: ${INTELLIGENCE_DB_USER:animallink_intelligence}
    password: ${INTELLIGENCE_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8085}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      show-components: always
animallink:
  identity:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
    connect-timeout-ms: ${IDENTITY_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${IDENTITY_READ_TIMEOUT_MS:3000}
  animal:
    base-url: ${ANIMAL_SERVICE_URL:http://localhost:8082}
    connect-timeout-ms: ${ANIMAL_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${ANIMAL_READ_TIMEOUT_MS:5000}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET_INTELLIGENCE:animallink-intelligence}
    animal-bucket: ${MINIO_BUCKET_ANIMAL:animallink-animal}
  ai:
    provider: ${AI_PROVIDER:mock}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    model-name: ${AI_MODEL_NAME:local-observation-mock}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${AI_READ_TIMEOUT_MS:20000}
  embedding:
    provider: ${EMBEDDING_PROVIDER:mock}
    base-url: ${EMBEDDING_BASE_URL:https://api.openai.com/v1}
    api-key: ${EMBEDDING_API_KEY:}
    model-name: ${EMBEDDING_MODEL_NAME:local-image-embedding-mock}
    model-version: ${EMBEDDING_MODEL_VERSION:v1}
    connect-timeout-ms: ${EMBEDDING_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${EMBEDDING_READ_TIMEOUT_MS:15000}
  matching:
    recall-limit: ${MATCHING_RECALL_LIMIT:50}
    weights:
      experiments:
        A:
          image: ${MATCHING_WEIGHT_A_IMAGE:1.0}
          trait: ${MATCHING_WEIGHT_A_TRAIT:0.0}
          geo: ${MATCHING_WEIGHT_A_GEO:0.0}
          history: ${MATCHING_WEIGHT_A_HISTORY:0.0}
        B:
          image: ${MATCHING_WEIGHT_B_IMAGE:0.65}
          trait: ${MATCHING_WEIGHT_B_TRAIT:0.35}
          geo: ${MATCHING_WEIGHT_B_GEO:0.0}
          history: ${MATCHING_WEIGHT_B_HISTORY:0.0}
        C:
          image: ${MATCHING_WEIGHT_C_IMAGE:0.55}
          trait: ${MATCHING_WEIGHT_C_TRAIT:0.30}
          geo: ${MATCHING_WEIGHT_C_GEO:0.15}
          history: ${MATCHING_WEIGHT_C_HISTORY:0.0}
        D:
          image: ${MATCHING_WEIGHT_D_IMAGE:0.50}
          trait: ${MATCHING_WEIGHT_D_TRAIT:0.30}
          geo: ${MATCHING_WEIGHT_D_GEO:0.12}
          history: ${MATCHING_WEIGHT_D_HISTORY:0.08}
logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
