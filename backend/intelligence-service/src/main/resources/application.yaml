spring:
  application:
    name: intelligence-service
  profiles:
    default: local
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        file-extension: yaml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/animallink_intelligence?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC
    username: ${INTELLIGENCE_DB_USER:animallink_intelligence}
    password: ${INTELLIGENCE_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8085}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      show-components: always
animallink:
  identity:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
    connect-timeout-ms: ${IDENTITY_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${IDENTITY_READ_TIMEOUT_MS:3000}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET_INTELLIGENCE:animallink-intelligence}
  ai:
    provider: ${AI_PROVIDER:mock}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    model-name: ${AI_MODEL_NAME:local-observation-mock}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${AI_READ_TIMEOUT_MS:20000}
logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
