spring:
  application:
    name: identity-service
  profiles:
    default: secure
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        file-extension: yaml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/animallink_identity?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC
    username: ${IDENTITY_DB_USER:animallink_identity}
    password: ${IDENTITY_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8081}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      show-components: always
animallink:
  authentication:
    session:
      idle-timeout: ${AUTH_SESSION_IDLE_TIMEOUT:PT30M}
      absolute-timeout: ${AUTH_SESSION_ABSOLUTE_TIMEOUT:PT8H}
    login-protection:
      maximum-attempts: ${AUTH_LOGIN_MAXIMUM_ATTEMPTS:5}
      maximum-source-attempts: ${AUTH_LOGIN_MAXIMUM_SOURCE_ATTEMPTS:20}
      attempt-window: ${AUTH_LOGIN_ATTEMPT_WINDOW:PT15M}
      block-duration: ${AUTH_LOGIN_BLOCK_DURATION:PT15M}
    retention:
      audit: ${AUTH_AUDIT_RETENTION:P180D}
      login-attempt-state: ${AUTH_LOGIN_ATTEMPT_RETENTION:P1D}
      cleanup-batch-size: ${AUTH_RETENTION_CLEANUP_BATCH_SIZE:1000}
      initial-delay-ms: ${AUTH_RETENTION_INITIAL_DELAY_MS:3600000}
      fixed-delay-ms: ${AUTH_RETENTION_FIXED_DELAY_MS:3600000}
  intelligence:
    base-url: ${INTELLIGENCE_BASE_URL:http://localhost:8085}
    connect-timeout-ms: ${INTELLIGENCE_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${INTELLIGENCE_READ_TIMEOUT_MS:5000}
  credential-precheck:
    dispatcher:
      enabled: ${CREDENTIAL_PRECHECK_DISPATCHER_ENABLED:true}
      fixed-delay-ms: ${CREDENTIAL_PRECHECK_DISPATCHER_FIXED_DELAY_MS:5000}
      batch-size: ${CREDENTIAL_PRECHECK_DISPATCHER_BATCH_SIZE:10}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET_IDENTITY:animallink-identity}
logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}] [userId=%X{userId:-}]"
---
spring:
  config:
    activate:
      on-profile: "!test & !admin-bootstrap"
    import: optional:nacos:${spring.application.name}.yaml
