name: Phase 2C MySQL and service assertion integration

on:
  pull_request:
    paths:
      - '.github/workflows/phase2c-mysql-integration.yml'
      - '.github/scripts/phase2c_http_smoke.py'
      - 'backend/pom.xml'
      - 'backend/animal-service/**'
      - 'backend/intelligence-service/**'

permissions:
  contents: read

jobs:
  http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0.41
        env:
          MYSQL_ROOT_PASSWORD: smoke-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -psmoke-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build independent service JARs
        run: ./mvnw -pl backend/animal-service,backend/intelligence-service -am -DskipTests package
      - name: Start isolated object storage
        run: |
          docker build -t animallink-smoke-minio infra/minio
          docker run -d --name phase2c-smoke-minio -p 9000:9000 -e MINIO_ROOT_USER=smoke-access -e MINIO_ROOT_PASSWORD=smoke-secret-123 animallink-smoke-minio server /data
      - name: Install smoke dependencies
        run: python -m pip install 'PyMySQL==1.1.1' 'boto3==1.35.99'
      - name: Run independent-process HTTP smoke
        run: python .github/scripts/phase2c_http_smoke.py

  phase2c-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify isolated Docker Engine
        run: docker version
      - name: Generate test-only observation assertion key
        run: |
          key=$(openssl rand -base64 32)
          echo "::add-mask::$key"
          echo "ANIMALLINK_AUTHENTICATION_OBSERVATION_ASSERTION_KEY=$key" >> "$GITHUB_ENV"
      - name: Run Phase 2C MySQL, concurrency and assertion tests
        run: >-
          ./mvnw -pl backend/intelligence-service,backend/animal-service -am
          -Dtest=Phase2CIncrementalMigrationTest,Phase2CObservationFinalizationIntegrationTest,Phase2CManualFallbackUnitTest,ObservationServiceAssertionVerifierTest,ObservationServiceAssertionSignerTest,HttpObservationFinalizationGatewayTest,InternalObservationFinalizationSecurityTest
          -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Retain targeted Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2c-targeted-surefire
          path: |
            backend/intelligence-service/target/surefire-reports/**
            backend/animal-service/target/surefire-reports/**
          retention-days: 7
          if-no-files-found: warn

  full-intelligence:
    needs: phase2c-targeted
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify isolated Docker Engine
        run: docker version
      - name: Run complete Intelligence module tests
        run: ./mvnw -pl backend/intelligence-service -am test
      - name: Retain Intelligence Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2c-intelligence-surefire
          path: backend/intelligence-service/target/surefire-reports/**
          retention-days: 7
          if-no-files-found: warn

  full-animal:
    needs: phase2c-targeted
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify isolated Docker Engine
        run: docker version
      - name: Build repository MinIO image required by existing media test
        run: docker build -t animallink-minio:RELEASE.2025-10-15T17-29-55Z infra/minio
      - name: Generate test-only observation assertion key
        run: |
          key=$(openssl rand -base64 32)
          echo "::add-mask::$key"
          echo "ANIMALLINK_AUTHENTICATION_OBSERVATION_ASSERTION_KEY=$key" >> "$GITHUB_ENV"
      - name: Run complete Animal module tests
        run: ./mvnw -pl backend/animal-service -am test
      - name: Retain Animal Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2c-animal-surefire
          path: backend/animal-service/target/surefire-reports/**
          retention-days: 7
          if-no-files-found: warn
