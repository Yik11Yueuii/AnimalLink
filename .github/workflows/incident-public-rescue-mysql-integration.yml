name: Incident public rescue MySQL integration

on:
  pull_request:
    paths:
      - '.github/workflows/incident-public-rescue-mysql-integration.yml'
      - 'backend/pom.xml'
      - 'backend/incident-service/**'
      - 'backend/api-gateway/**'
      - 'miniapp/**'
      - '.github/scripts/mini_rescue_claim_http_smoke.py'
      - 'backend/identity-service/**'

permissions:
  contents: read

jobs:
  rescue-write:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify runner Docker Engine
        run: docker version
      - name: Run rescue write MySQL integration test
        run: >-
          ./mvnw -pl backend/incident-service -am
          -Dtest=MiniappRescueDraftIntegrationTest
          -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Print Surefire failure summary
        if: failure()
        run: |
          find backend/incident-service/target/surefire-reports -maxdepth 1 -type f \( -name '*.txt' -o -name 'TEST-*.xml' \) -print -exec sed -n '1,240p' {} \; || true
  public-rescue-read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify runner Docker Engine
        run: docker version

      - name: Run public rescue MySQL integration test
        run: >-
          ./mvnw -pl backend/incident-service -am
          -Dtest=PublicRescueReadIntegrationTest
          -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Print Surefire failure summary
        if: failure()
        run: |
          find backend/incident-service/target/surefire-reports -maxdepth 1 -type f \( -name '*.txt' -o -name 'TEST-*.xml' \) -print -exec sed -n '1,240p' {} \; || true

  case-action-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run CaseAction and lifecycle MySQL integration tests
        run: >-
          ./mvnw -pl backend/incident-service
          -Dtest=CaseActionIntegrationTest,CaseClaimConcurrencyIntegrationTest,CaseClaimErrorIntegrationTest,CaseParticipantTransitionConcurrencyIntegrationTest,CaseResultConcurrencyIntegrationTest,CaseResultIntegrationTest,CaseOwnerTransferConcurrencyIntegrationTest test

  miniapp-claim-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
        working-directory: miniapp
      - run: npm run check
        working-directory: miniapp
        env:
          TZ: Asia/Shanghai
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify gateway and incident assertion policies
        run: >-
          ./mvnw -pl backend/api-gateway,backend/incident-service -am
          -Dtest=IncidentMiniappGatewayPolicyTest,IncidentMiniappAssertionSignerTest,WechatRescueClaimControllerTest,IncidentMiniappRequestPolicyTest
          -Dsurefire.failIfNoSpecifiedTests=false test

  three-service-claim-http:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0.41
        env:
          MYSQL_ROOT_PASSWORD: smoke-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -psmoke-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build three independent services
        run: ./mvnw -pl backend/api-gateway,backend/identity-service,backend/incident-service -am -DskipTests package
      - name: Install MySQL driver
        run: python -m pip install PyMySQL==1.1.1
      - name: Run three-process HTTP claim smoke
        run: python .github/scripts/mini_rescue_claim_http_smoke.py
