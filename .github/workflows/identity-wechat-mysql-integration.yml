name: Identity WeChat MySQL integration

on:
  pull_request:
    paths:
      - '.github/workflows/identity-wechat-mysql-integration.yml'
      - 'backend/pom.xml'
      - 'backend/identity-service/**'

permissions:
  contents: read

jobs:
  wechat-user-session:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify runner Docker Engine
        run: docker version

      - name: Run Identity WeChat MySQL integration test
        run: >-
          ./mvnw -pl backend/identity-service -am
          -Dtest=WechatAuthenticationMySqlIntegrationTest,InternalWechatCampusIdentityHttpIntegrationTest
          -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Print Surefire failure summary
        if: failure()
        run: |
          find backend/identity-service/target/surefire-reports -maxdepth 1 -type f \( -name '*.txt' -o -name 'TEST-*.xml' \) -print -exec sed -n '1,240p' {} \; || true
